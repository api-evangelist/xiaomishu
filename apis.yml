aid: xiaomishu
name: Xiaomishu (订餐小秘书)
description: 'Xiaomishu (订餐小秘书, "Dining Little Secretary") is a Shanghai-based restaurant
  reservation and dining-marketing technology company operating since 2005 via xiaomishu.com
  and the 021-57575777 booking hotline. Its platforms — 订餐小秘书, 宴位 (Yanwei, an
  AI-driven dynamic-pricing product for restaurant private rooms), and 高能店长 — let
  diners book tables and discounted private-room packages at Shanghai restaurants through
  web, WAP (m.xiaomishu.com / m.57.cn), phone, and WeChat mini-program channels. The company
  cites strategic investment from Ctrip and SIG and was surfaced in the API Evangelist
  network as a Qiming Venture Partners portfolio lead. It publishes no public developer
  API, portal, or machine-readable surface; api.xiaomishu.com serves a closed (HTTP 403)
  backend, and the main site is HTTP-only with a mismatched HTTPS certificate.'
